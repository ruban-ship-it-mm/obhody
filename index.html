function detectIso(text){
 const t=' '+String(text||'').toLowerCase().replace(/ё/g,'е')+' ';if(t.trim().length<3)return '';
 let best='',bs=0;
 ISO_RULES.forEach(([k,w,re])=>{const g=new RegExp(re.source.replace(/ё/g,'е'),'g');const m=t.match(g);if(m){const s=m.length*w;if(s>bs){bs=s;best=k}}});
 return best?(ISO.find(x=>isoNum(x)===best)||best):'';
}

let rec=null;

function toggleMic(){
 if(rec){const r=rec;try{r.stop()}catch(_){stopMic()}return}

 const ta=$('#f_desc'),btn=$('#micBtn');

 const base=ta.value.replace(/\s+$/,'');
 const r=new SR();rec=r;
 r.lang='ru-RU';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
 r.onresult=e=>{
  let t='';for(let k=0;k<e.results.length;k++)t+=e.results[k][0].transcript;
  t=t.trim();
  if(t&&(!base||/[.!?]$/.test(base)))t=t.charAt(0).toUpperCase()+t.slice(1);
  ta.value=base?(t?base+' '+t:base):t;
  ta.scrollTop=ta.scrollHeight;

 };
 r.onerror=e=>{
  if(e.error==='not-allowed'||e.error==='service-not-allowed')alert('Нет доступа к микрофону.\n\niPhone: Настройки → Safari → Микрофон → «Разрешить».\nAndroid: значок замка в адресной строке → Микрофон → «Разрешить».\n\nМожно также использовать микрофон 🎤 на клавиатуре.');
  else if(e.error==='network')toast('Нет интернета — распознавание недоступно');
  else if(e.error!=='no-speech'&&e.error!=='aborted')toast('Ошибка распознавания: '+e.error);
 };
 r.onend=()=>{if(rec===r){rec=null;document.getElementById('micBtn')?.classList.remove('rec');toast('Запись остановлена')}};
 try{r.start();btn.classList.add('rec');toast('Говорите… Нажмите ещё раз, чтобы остановить')}

function compress(file,max=1400,q=0.72){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
 img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
 img.onerror=rej;img.src=url})}

function summarize(items){
 const Z=new Map(),P=new Map();
 items.forEach(i=>{
  const z=i.zone||'Без зоны',done=i.status==='done';
  if(!Z.has(z))Z.set(z,{name:z,total:0,open:0,hi:0,over:0,done:0});
  const s=Z.get(z);s.total++;if(done)s.done++;else{s.open++;if(i.priority==3)s.hi++;if(isOver(i))s.over++}
  respOrNone(i).forEach(r=>{if(!P.has(r))P.set(r,{name:r,items:[],open:0,hi:0,over:0});
  const p=P.get(r);p.items.push(i);if(!done){p.open++;if(i.priority==3)p.hi++;if(isOver(i))p.over++}});
 });
 const dn=i=>i.status==='done'?1:0;
 const people=[...P.values()].map(p=>{p.items.sort((a,b)=>dn(a)-dn(b)||isOver(b)-isOver(a)||(b.priority||2)-(a.priority||2)||
   (a.deadline||'9999').localeCompare(b.deadline||'9999')||a._n-b._n);return p})
  .sort((a,b)=>(a.name==='Не назначен')-(b.name==='Не назначен')||b.open-a.open||b.items.length-a.items.length);
 const zones=[...Z.values()].sort((a,b)=>b.total-a.total);
 const IM=new Map();items.forEach(i=>{const k=i.iso||'Не указан';IM.set(k,(IM.get(k)||0)+1)});
 const isos=[...IM.entries()].map(([name,total])=>({name,total})).sort((a,b)=>(a.name==='Не указан')-(b.name==='Не указан')||b.total-a.total);
 return {zones,people,isos};
}

/* ---------- Разметка фото: круги, стрелки, карандаш ---------- */
let A=null,annTool='circle',annCol='#ef4444';
const COLS=['#ef4444','#facc15','#ffffff','#3b82f6'];
function annotate(k){
 const src=(draft.ann[k]&&draft.ann[k].o)||draft.photos[k];
 const img=new Image();
 img.onload=()=>{
  A={k,img,shapes:draft.ann[k]?JSON.parse(JSON.stringify(draft.ann[k].s)):[],cur:null};
  const el=document.createElement('div');el.id='ann';
  el.innerHTML=`<div class="an-top"><button class="hb" onclick="annClose()">${ic('x')}</button>
   <div class="an-t">Отметьте проблему</div>
   <button class="hb" onclick="annUndo()" title="Отменить">${ic('undo')}</button>
   <button class="an-ok" onclick="annSave()">${ic('check')} Готово</button></div>
  <div class="an-wrap"><canvas id="anc"></canvas></div>
  <div class="an-bot">
   <div class="an-tools">${[['circle','circ','Круг'],['arrow','arrow','Стрелка'],['pen','edit','Карандаш']].map(([t,i,l])=>
    `<button data-t="${t}" class="${t===annTool?'on':''}" onclick="annSetTool('${t}')">${ic(i)}${l}</button>`).join('')}</div>
   <div class="an-cols">${COLS.map(c=>`<button data-c="${c}" class="${c===annCol?'on':''}" style="background:${c}" onclick="annSetCol('${c}')"></button>`).join('')}</div>
   <div class="an-hint">Круг: проведите по диагонали или просто коснитесь. Стрелка: ведите от начала к проблеме</div></div>`;
  document.body.append(el);
  const c=$('#anc');c.width=img.naturalWidth;c.height=img.naturalHeight;
  const pt=e=>{const r=c.getBoundingClientRect();return[+((e.clientX-r.left)/r.width).toFixed(4),+((e.clientY-r.top)/r.height).toFixed(4)]};
  c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);const p=pt(e);A.cur={t:annTool,c:annCol,p:annTool==='pen'?[p]:[p,p]};annDraw()};
  c.onpointermove=e=>{if(!A||!A.cur)return;const p=pt(e);if(A.cur.t==='pen')A.cur.p.push(p);else A.cur.p[1]=p;annDraw()};
  c.onpointerup=c.onpointercancel=()=>{
   const s=A&&A.cur;if(!s)return;A.cur=null;
   const a=s.p[0],z=s.p[s.p.length-1],d=Math.hypot(z[0]-a[0],z[1]-a[1]);
   if(s.t==='circle'&&d<.03){const r=.07,ry=r*c.width/c.height;s.p=[[a[0]-r,a[1]-ry],[a[0]+r,a[1]+ry]]}
   else if(s.t==='arrow'&&d<.03){annDraw();return}
   else if(s.t==='pen'&&s.p.length<2){annDraw();return}
   A.shapes.push(s);annDraw()};
  requestAnimationFrame(()=>{annFit();annDraw()});
 };
 img.src=src;
}
function annFit(){const c=$('#anc');if(!c)return;const w=c.parentElement.clientWidth-12,h=c.parentElement.clientHeight-12,k=Math.min(w/c.width,h/c.height);
 c.style.width=Math.floor(c.width*k)+'px';c.style.height=Math.floor(c.height*k)+'px'}
function annDraw(){
 const c=$('#anc');if(!c||!A)return;const x=c.getContext('2d'),W=c.width,H=c.height;
 x.drawImage(A.img,0,0,W,H);
 [...A.shapes,A.cur].filter(Boolean).forEach(s=>drawShape(x,s,W,H));
}
function drawShape(x,s,W,H){
 const lw=Math.max(4,Math.round(Math.max(W,H)*.008));
 x.save();x.strokeStyle=s.c;x.fillStyle=s.c;x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';
 x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=lw*1.2;
 const P=s.p.map(([a,b])=>[a*W,b*H]);
 if(s.t==='circle'){const[[a,b],[c,d]=P[0]]=P;x.beginPath();
  x.ellipse((a+c)/2,(b+d)/2,Math.max(2,Math.abs(c-a)/2),Math.max(2,Math.abs(d-b)/2),0,0,Math.PI*2);x.stroke()}
 else if(s.t==='arrow'){const[[x1,y1],[x2,y2]=P[0]]=P,an=Math.atan2(y2-y1,x2-x1),h=lw*4.5;

 const zt=first+zones.length,zl=zt-1;
 zr.push([{v:'ИТОГО',s:7},{v:'',s:7},{f:`SUM(C${first}:C${zl})`,s:9}]);

 const ir=[[{v:'Нарушения по пунктам ISO 9001',s:6}],[{v:sub}],[],head(['Пункт ISO 9001','Замечаний'])];
 isos.forEach((x,k)=>{const r=first+k;ir.push([{v:x.name,s:7},x.name==='Не указан'?{f:`COUNTBLANK(${R}F${first}:F${last})`,s:4}:{f:`COUNTIF(${R}$F:$F,$A${r})`,s:4}])});
 const itt=first+isos.length;
 ir.push([{v:'ИТОГО',s:7},{f:`SUM(B${first}:B${itt-1})`,s:9}]);
 const shIso={name:'По пунктам ISO',rows:ir,heights:[24,0,0,32],cols:[62,12],freeze:4,merge:['A1:B1','A2:B2']};
 if(0){const rows=[[{v:'Контроль устранения замечаний',s:6}],[{v:sub}],[],head(['№','Дата обхода','Зона','Место','Что не так','Ответственный','Приоритет','Срок','Статус','Дата устранения','Просрочка, дн.','Комментарий по устранению','Отметка контроля'])];
 const heights=[24,0,0,32];
 items.forEach((i,k)=>{const r=first+k;
  rows.push([{v:i._n,s:4},{d:i._a?i._a.slice(0,10):'',s:3},{v:i.zone||'Без зоны',s:2},{v:i.place||'',s:2},{v:i.desc||'',s:2},{v:respText(i)||'Не назначен',s:2},
   {v:PR[i.priority]||'Средний',s:8},{d:i.deadline||'',s:3},{v:i.status==='done'?'устранено':'открыто',s:8},{d:locDate(i.doneAt),s:3},
   {f:`IF(AND(I${r}="открыто",ISNUMBER(H${r}),H${r}<TODAY()),TODAY()-H${r},"")`,s:4},{v:i.fixNote||'',s:2},{v:'',s:2}]);
  const lines=Math.max(1,...[[i.desc,45],[i.place,22],[i.fixNote,30],[i.zone,18],[respText(i),22]].map(([t,w])=>{t=String(t||'');return t.split('\n').reduce((s,l)=>s+Math.max(1,Math.ceil(l.length/(w*1.1))),0)}));
  heights.push(Math.min(15*lines+3,200));
 });
 const shItems={name:SN,rows,heights,cols:[6,12,18,22,45,22,11,12,13,13,11,30,20],freeze:4,filter:`A4:M${last}`,merge:['A1:M1','A2:M2'],
  dv:[[`I${first}:I${end}`,['открыто','устранено']],[`G${first}:G${end}`,['Низкий','Средний','Высокий']]],
  cf:[[`A${first}:M${end}`,[[1,`AND(ISNUMBER($K${first}),$K${first}>0)`]]],[`I${first}:I${end}`,[[0,`$I${first}="устранено"`],[2,`$I${first}="открыто"`]]]]};
 const {zones,people}=summarize(items);
 /* Лист: по ответственным */
 const pr=[[{v:'Кому что делать — контроль по ответственным',s:6}],[{v:sub}],[],head(['Ответственный','Всего','Открыто','Просрочено','Устранено','% выполнения'])];
 people.forEach((p,k)=>{const r=first+k,n=`$A${r}`,F=`${R}$F:$F,"*"&${n}&"*"`;
  pr.push([{v:p.name,s:7},{f:`COUNTIF(${F})`,s:4},{f:`COUNTIFS(${F},${R}$I:$I,"открыто")`,s:4},{f:`COUNTIFS(${F},${R}$I:$I,"открыто",${R}$H:$H,"<"&TODAY())`,s:4},
   {f:`COUNTIFS(${F},${R}$I:$I,"устранено")`,s:4},{f:`IF(B${r}=0,"",E${r}/B${r})`,s:5}])});
 const pt=first+people.length,pl=pt-1;
 pr.push([{v:'ИТОГО',s:7},...['B','C','D','E'].map(c=>({f:`SUM(${c}${first}:${c}${pl})`,s:9})),{f:`IF(B${pt}=0,"",E${pt}/B${pt})`,s:10}]);
 const shPeople={name:'По ответственным',rows:pr,heights:[24,0,0,32],cols:[32,10,10,12,11,14],freeze:4,merge:['A1:F1','A2:F2'],
  cf:[[`D${first}:D${pt}`,[[1,`D${first}>0`]]],[`C${first}:C${pl}`,[[2,`C${first}>0`]]],[`F${first}:F${pt}`,[[0,`AND(ISNUMBER(F${first}),F${first}>=1)`]]]]};
 /* Лист: по зонам */
 const zr=[[{v:'Градация по зонам',s:6}],[{v:sub}],[],head(['Зона','Оценка','Всего','Открыто','Высокий приоритет','Просрочено','Устранено','% выполнения'])];
 zones.forEach((z,k)=>{const r=first+k,C=`${R}$C:$C,$A${r}`;
  zr.push([{v:z.name,s:7},{f:`IF(E${r}+F${r}>0,"Критично",IF(D${r}>0,"Требует внимания","В норме"))`,s:8},{f:`COUNTIF(${C})`,s:4},
   {f:`COUNTIFS(${C},${R}$I:$I,"открыто")`,s:4},{f:`COUNTIFS(${C},${R}$I:$I,"открыто",${R}$G:$G,"Высокий")`,s:4},
   {f:`COUNTIFS(${C},${R}$I:$I,"открыто",${R}$H:$H,"<"&TODAY())`,s:4},{f:`COUNTIFS(${C},${R}$I:$I,"устранено")`,s:4},{f:`IF(C${r}=0,"",G${r}/C${r})`,s:5}])});
 const zt=first+zones.length,zl=zt-1;
 zr.push([{v:'ИТОГО',s:7},{v:'',s:7},...['C','D','E','F','G'].map(c=>({f:`SUM(${c}${first}:${c}${zl})`,s:9})),{f:`IF(C${zt}=0,"",G${zt}/C${zt})`,s:10}]);
 const shZones={name:'По зонам',rows:zr,heights:[24,0,0,32],cols:[30,18,9,10,12,12,11,14],freeze:4,merge:['A1:H1','A2:H2'],
  cf:[[`B${first}:B${zl}`,[[1,`$B${first}="Критично"`],[2,`$B${first}="Требует внимания"`],[0,`$B${first}="В норме"`]]],[`F${first}:F${zt}`,[[1,`F${first}>0`]]]]};
 }
 const blob=buildXlsx([shPeople,shZones,shIso,shItems]);
 if(scope==='audit')markExp('xlsx');
 return saveFile(blob,fname+'.xlsx');
}

/* ---------- Сохранение файла: на телефоне — меню «Поделиться» (Файлы / Диск / мессенджер), на ПК — в «Загрузки» ---------- */
const XMIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
let pendingFile=null;
function isMobile(){return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform))}
function inApp(){return /Telegram|WhatsApp|Instagram|FBAN|FBAV|VKClient|Viber|; wv\)/i.test(navigator.userAgent)}
function downloadBlob(blob,name){
 blob=new Blob([blob],{type:XMIME});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.type=XMIME;a.download=name;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),15000);
}
async function saveFile(blob,name){
 const file=new File([blob],name,{type:XMIME});
 // Только файл, без title/text: иначе мессенджеры отправляют текст вместо файла
 if(isMobile()&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file]});toast('Excel сохранён ✓');return}
  catch(e){
   if(e.name==='AbortError')return;
   pendingFile=file;return saveAgainSheet(name);
  }
 }
 // Android Chrome не умеет «делиться» xlsx — сохраняем в «Загрузки» и подсказываем, как отправить
 downloadBlob(blob,name);
 if(isMobile())downloadedSheet(name);else toast('Excel-файл сохранён в «Загрузки» ✓');
}
function downloadedSheet(name){
 modal(`<div class="sh-t">Excel сохранён ✓</div>
 <div class="mut" style="margin:6px 0 12px">Файл <b>${esc(name)}</b> лежит в папке <b>«Загрузки»</b> (Download).</div>
 <div class="card" style="background:#f0fdf4;box-shadow:none"><b>Как отправить в чат файлом:</b><br>
 1. В мессенджере нажмите 📎 (скрепку) → <b>«Файл»</b> (не «Галерея»).<br>
 2. Откройте папку «Загрузки» и выберите файл .xlsx.</div>
 ${inApp()?`<div class="card" style="background:#fef3c7;box-shadow:none">⚠️ Приложение открыто внутри мессенджера. В нём файлы часто не сохраняются или открываются текстом. Откройте ссылку в браузере: меню ⋮ → <b>«Открыть в Chrome / Safari»</b>.</div>`:''}
 <div class="sfoot"><button class="btn full" onclick="closeModal()">Понятно</button></div>`);
}
function saveAgainSheet(name){
 modal(`<div class="sh-t">Excel-файл готов</div>
 <div class="mut" style="margin:6px 0 16px">${esc(name)}<br>Нажмите кнопку и выберите «Сохранить в Файлы», Google Диск или мессенджер.</div>
 <button class="btn g big full" onclick="sharePending()">${ic('xls')} Сохранить файл</button>
 <div class="sfoot"><button class="btn full" onclick="closeModal()">Закрыть</button></div>`);
}
async function sharePending(){
 if(!pendingFile)return;
 try{await navigator.share({files:[pendingFile]});closeModal();toast('Excel сохранён ✓')}
 catch(e){if(e.name!=='AbortError'){downloadBlob(pendingFile,pendingFile.name);downloadedSheet(pendingFile.name)}}
}

/* ---------- Окно «Обход завершён»: PDF + Excel в архив ---------- */
function markExp(k){
 if(!cur)return;cur.exports={...(cur.exports||{}),[k]:new Date().toISOString()};
 putAudit(cur);updDone();
}
function expPdf(){markExp('pdf');auditReport()}
function expXls(){excelExport('audit')}
function updDone(){
 const e=cur&&cur.exports||{},t=s=>new Date(s).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
 const p=$('#d_pdf'),x=$('#d_xls');
 if(p)p.innerHTML=ic(e.pdf?'check':'pdf')+(e.pdf?' PDF сохранён в '+t(e.pdf)+' · ещё раз':' Сохранить PDF');
 if(x)x.innerHTML=ic(e.xlsx?'check':'xls')+(e.xlsx?' Excel сохранён в '+t(e.xlsx)+' · ещё раз':' Сохранить Excel');
}
function doneSheet(){
 modal(`<div class="sh-t">Обход завершён ✓</div>
 <div class="mut" style="margin:6px 0 16px">Сохраните оба отчёта в архив: <b>PDF</b> для ознакомления (фото и комментарии), <b>Excel</b> для контроля выполнения ответственными. Удобно класть оба файла в одну папку.</div>
 <button class="btn p big full" id="d_pdf" onclick="expPdf()"></button>
 <button class="btn g big full" style="margin-top:10px" id="d_xls" onclick="expXls()"></button>
 <div class="sfoot"><button class="btn full" onclick="closeModal()">Готово</button></div>`);
 updDone();
}

async function saveSettings(){
 S.company=$('#s_co').value.trim();S.auditor=$('#s_aud').value.trim();
 S.zones=$('#s_z').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const[n,r]=l.split('|').map(x=>x.trim());return{name:n,resp:r||''}});
 S.people=$('#s_p').value.split('\n').map(l=>l.trim()).filter(Boolean);
 S.places=$('#s_pl').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const k=l.indexOf(':'),z=k>0?l.slice(0,k).trim():'';
  return S.zones.some(x=>x.name===z)?{zone:z,name:l.slice(k+1).trim()}:{zone:'',name:l}}).filter(p=>p.name);
 S.zones.forEach(z=>{if(z.resp&&!S.people.includes(z.resp))S.people.push(z.resp)});
 await setKV('settings',S);toast('Сохранено ✓');home();
}
async function exportBackup(){
 const data={app:'obhody',v:3,exported:new Date().toISOString(),settings:S,audits:await getAll()};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
 a.download='obhody_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}
function importBackup(){
 const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=async()=>{try{const d=JSON.parse(await inp.files[0].text());if(!Array.isArray(d.audits))throw 0;
  if(!confirm(`Загрузить обходов: ${d.audits.length}? Совпадающие будут заменены.`))return;
  for(const a of d.audits)await putAudit(a);
  if(d.settings){S={...S,...d.settings};await setKV('settings',S)}
  toast('Восстановлено ✓');home()}catch(e){alert('Не удалось прочитать файл копии')}};
 inp.click();
}
